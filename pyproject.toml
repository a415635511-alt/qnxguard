[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxguard"
version = "1.0.0"
description = "Host-side static safety, mkifs buildfile, and real-time auditor for QNX SDP 8.0"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
qnxguard = "qnxguard.cli:main"
